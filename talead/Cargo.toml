[package]
name = "talead"
version = "0.1.0"
edition = "2024"
description = "The talea ledger daemon: init (migrate, generate token, seed, write .env) and serve"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
talea_core = { path = "../talea-core/" }
talea-server = { path = "../talea-server/" }
talea_store_postgres = { path = "../talea-store-postgres/" }
talea-store-sqlite = { path = "../talea-store-sqlite/" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
