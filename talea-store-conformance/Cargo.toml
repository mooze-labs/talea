[package]
name = "talea-store-conformance"
version = "0.1.0"
edition = "2024"
publish = false
description = "Backend-agnostic conformance suite that every talea Store implementation must pass"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
chrono = "0.4.44"
futures = "0.3.32"
serde_json = "1.0.150"
talea-core = { path = "../talea-core/", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["time", "macros", "rt"] }
uuid = { version = "1.23.2", features = ["v4"] }

# Dev tooling (bench harness / conformance suite): unwrap/expect are the
# correct failure mode here, as in tests. unsafe stays forbidden.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
