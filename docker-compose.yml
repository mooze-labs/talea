# Local Postgres for Talea development:
#   docker compose up -d
#   talead init --db-url postgres://talea:talea@localhost:5432/talea
#
# Optional Prometheus + Grafana over the server's metrics (see README "Metrics"):
#   TALEA_METRICS_BIND=0.0.0.0:9100 talead serve
#   docker compose --profile metrics up -d
#   open http://localhost:9090   # Prometheus
#   open http://localhost:3000   # Grafana, canned "talea" dashboard, no login
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: talea
      POSTGRES_PASSWORD: talea
      POSTGRES_DB: talea
    ports:
      - "5432:5432"
    volumes:
      - talea-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talea -d talea"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: ["metrics"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # makes host.docker.internal resolve on Linux too (built-in on
      # Docker Desktop); the talea server runs on the HOST, not in compose
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["metrics"]
    ports:
      - "3000:3000"
    environment:
      # dev-only: anonymous admin, straight to the dashboard
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  talea-pg:
