[package]
name = "talea_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
utoipa = { version = "5", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.23.2", features = ["serde"] }

[features]
openapi = ["dep:utoipa"]
