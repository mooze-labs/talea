[package]
name = "talea-core"
version = "0.1.1"
edition = "2024"
description = "Core contracts for the talea ledger: domain types, the Store persistence trait, and the LedgerApi service trait"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
utoipa = { version = "5", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.23.2", features = ["serde"] }

[features]
openapi = ["dep:utoipa"]

[lints]
workspace = true
