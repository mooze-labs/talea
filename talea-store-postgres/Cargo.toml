[package]
name = "talea-store-postgres"
version = "0.1.0"
edition = "2024"
description = "Postgres storage backend for the talea ledger, with LISTEN/NOTIFY-driven live event subscriptions"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
async-stream = "0.3"
async-trait = "0.1.89"
chrono = "0.4.44"
futures = "0.3.32"
metrics = "0.24"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "uuid", "json", "runtime-tokio"] }
talea-core = { path = "../talea-core/", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["sync", "rt"] }
uuid = { version = "1.23.2", features = ["v7"] }

[dev-dependencies]
talea-store-conformance = { path = "../talea-store-conformance/" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
