[package]
name = "talea-cli"
version = "0.1.1"
edition = "2024"
description = "The talea command-line client for the talea ledger server: a thin shim over the talea-client SDK"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "talea_cli"
path = "src/lib.rs"

[[bin]]
name = "talea"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
talea-client = { path = "../talea-client/" }
talea-core = { path = "../talea-core/", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
talea-server = { path = "../talea-server/" }
talea-store-sqlite = { path = "../talea-store-sqlite/" }

[lints]
workspace = true
