[package]
name = "talea-store-log"
version = "0.1.0"
edition = "2024"
description = "Append-log storage backend for the talea ledger: in-memory state, group commit, strict fsync-per-batch durability"
license.workspace = true
repository.workspace = true

[dependencies]
async-stream = "0.3"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
crc32fast = "1.4"
fs4 = "0.13"
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
talea-core = { path = "../talea-core/", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1.52.3", features = ["sync", "rt", "fs", "io-util"] }
tracing = "0.1"
uuid = { version = "1.23.2", features = ["v7", "serde"] }

[dev-dependencies]
talea-store-conformance = { path = "../talea-store-conformance/" }
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
