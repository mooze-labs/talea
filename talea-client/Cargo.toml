[package]
name = "talea-client"
version = "0.1.2"
edition = "2024"
description = "Typed client SDK for the talea ledger server: retry-safe operations and auto-resuming event subscriptions"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "talea_client"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
eventsource-stream = "0.2"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
talea-core = { path = "../talea-core/", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["sqlite", "postgres", "runtime-tokio"] }
talea-server = { path = "../talea-server/" }
talea-store-sqlite = { path = "../talea-store-sqlite/" }
talea-store-postgres = { path = "../talea-store-postgres/" }

[lints]
workspace = true
