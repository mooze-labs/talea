[package]
name = "talea-client"
version = "0.1.0"
edition = "2024"

[lib]
name = "talea_client"
path = "src/lib.rs"

[[bin]]
name = "talea"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
talea_core = { path = "../talea-core/" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
talea-server = { path = "../talea-server/" }
talea-store-sqlite = { path = "../talea-store-sqlite/" }
