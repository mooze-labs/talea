[package]
name = "talea-client"
version = "0.1.1"
edition = "2024"
description = "Typed client SDK and the talea CLI for the talea ledger server: retry-safe operations and auto-resuming event subscriptions"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "talea_client"
path = "src/lib.rs"

[[bin]]
name = "talea"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The `talea` CLI. On by default so `cargo build`/`cargo run -p talea-client`
# build the binary unchanged. Library-only consumers can opt out with
# `default-features = false` to drop clap and its tree from the build.
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen"]

[dependencies]
async-stream = "0.3"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
eventsource-stream = "0.2"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
talea-core = { path = "../talea-core/", version = "0.1.0" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["sqlite", "postgres", "runtime-tokio"] }
talea-server = { path = "../talea-server/" }
talea-store-sqlite = { path = "../talea-store-sqlite/" }
talea-store-postgres = { path = "../talea-store-postgres/" }

[lints]
workspace = true
