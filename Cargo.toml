[workspace]
members = ["talea-bench", "talea-client", "talea-core", "talea-server", "talea-service", "talea-store-postgres", "talea-store-sqlite", "talea-store-conformance", "talea-store-log", "talead"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/mooze-labs/talea"

# Panic-free production code: no unwrap/expect outside tests (see clippy.toml
# for the test exemption), and no unsafe anywhere in the workspace.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
